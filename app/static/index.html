<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<script>try{var t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=t}catch(e){}</script>
<title>AGENT BROWSER // DATA CODE HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: { extend: { fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] } } },
  };
</script>
<style type="text/tailwindcss">
  @layer components {
    .icon-btn { @apply grid h-9 w-9 shrink-0 place-items-center rounded-lg text-zinc-400 transition hover:bg-white/[.07] hover:text-zinc-100 active:scale-95 disabled:pointer-events-none disabled:opacity-30; }
    .btn { @apply inline-flex items-center justify-center gap-2 rounded-lg px-3.5 h-9 text-sm font-medium transition active:scale-[.97]; }
    .btn-primary { @apply btn bg-indigo-500 text-white shadow-lg shadow-indigo-500/20 hover:bg-indigo-400; }
    .btn-ghost { @apply btn bg-white/[.06] text-zinc-200 hover:bg-white/10; }
    .field { @apply h-10 w-full rounded-lg border border-white/[.08] bg-zinc-900/80 px-3.5 text-sm text-zinc-100 outline-none transition placeholder:text-zinc-500 focus:border-indigo-400/60 focus:ring-4 focus:ring-indigo-500/15; }
    .select { @apply h-9 w-full cursor-pointer rounded-lg border border-white/[.08] bg-zinc-900 px-3 text-sm text-zinc-200 outline-none transition focus:border-indigo-400/60; }
    .side-tab { @apply flex flex-1 items-center justify-center gap-1.5 rounded-md py-1.5 text-[13px] font-medium text-zinc-400 transition hover:text-zinc-200; }
    .side-tab.active { @apply bg-white/10 text-white shadow-sm; }
    .label { @apply mb-2 text-[11px] font-semibold uppercase tracking-wider text-zinc-500; }
  }
</style>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/browser.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/overlays.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/skin-header.css">
<link rel="stylesheet" href="css/skin-browser.css">
<link rel="stylesheet" href="css/skin-controls.css">
<link rel="stylesheet" href="css/skin-sidebar.css">
<link rel="stylesheet" href="css/skin-overrides.css">
</head>
<body class="hud-body h-full overflow-hidden bg-[#0b0b0e] font-sans text-zinc-100 antialiased selection:bg-indigo-500/30">

<!-- Markup lives in components/*.html; loader.js injects each one in place of its placeholder, then loads js/*.js in order. -->
<div data-include="components/login.html"></div>

<div id="app" class="flex h-full" hidden>
  <div class="flex min-w-0 flex-1 flex-col">
    <div data-include="components/header.html"></div>
    <div data-include="components/stage.html"></div>
    <div data-include="components/controlbar.html"></div>
  </div>
  <div data-include="components/sidebar.html"></div>
</div>

<video id="pipVideo" muted playsinline style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0"></video>
<script src="loader.js"></script>
</body>
</html>
