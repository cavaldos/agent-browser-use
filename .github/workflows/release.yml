name: Release

# Runs when a tag vX.Y.Z is pushed (see scripts/release.sh).
# Publishes raw binaries named agent-browser-use-<os>-<arch>[.exe], the same layout
# as pitago, so scripts/install.sh can download them from releases/latest/download.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Test
        run: cd app && go vet ./... && go test ./...

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        # Same script scripts/test-release.sh runs locally; the target list lives in it.
        run: scripts/build-release.sh dist

      - name: Publish GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/agent-browser-use-* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/agent-browser-use-* \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
