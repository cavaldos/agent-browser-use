name: Release

# Runs when a tag vX.Y.Z is pushed (see scripts/release.sh).
on:
  push:
    tags: ['v*']  # format checked in the Resolve version step
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, e.g. v1.2.3'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad tag: $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Test
        run: cd app && go vet ./... && go test ./...

      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            name=agent-browser-use_${VERSION}_${os}_${arch}
            mkdir -p "dist/$name"
            # Embed cloudflared for the target so -tunnel works in the released binary.
            scripts/fetch-cloudflared.sh "$os" "$arch"
            GOOS=$os GOARCH=$arch OUT="dist/$name/agent-browser-use" scripts/build.sh
            cp LICENSE README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -rf "dist/$name"
          done
          cd dist && shasum -a 256 *.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$VERSION" dist/*.tar.gz dist/SHA256SUMS \
              --title "$VERSION" --generate-notes --verify-tag
          fi
