[package]
name = "agent-browser-use"
version = "0.0.0"
edition = "2021"
description = "Agent Browser Use: a shared browser that people and AI agents can watch and drive"

[[bin]]
name = "agent-browser-use"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
chromiumoxide = "0.9.1"
futures-util = "0.3"
humantime = "2.4.0"
lexopt = "0.3.2"
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "socks"] }
rust-embed = { version = "8.14.0", features = ["include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-socks = "0.5.3"
tokio-tungstenite = "0.30.0"
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace"] }
tracing = "0.1.44"
base64 = "0.23.1"
hex = "0.4.3"
hmac = "0.13.0"
rpassword = "7.5.5"
self-replace = "1.5.1"
sha2 = "0.11.1"
signal-hook = "0.4.6"
subtle = "2.6.1"
url = "2.5.9"
regex = "1"
if-addrs = "0.15.0"
libc = "0.2.191"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
boringtun = { version = "0.7.1", default-features = false }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-dns"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32.0", features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
