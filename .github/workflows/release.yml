name: Release

# Runs when a tag vX.Y.Z is pushed (see scripts/release.sh).
# Publishes raw binaries named agent-browser-use-<os>-<arch>[.exe], the same layout
# as pitago, so scripts/install.sh can download them from releases/latest/download.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Test
        run: cd app && go vet ./... && go test ./...

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=; [ "$os" = windows ] && ext=.exe
            # Absolute path: build.sh runs go build inside app/, so a relative OUT would land in app/dist/.
            out="$PWD/dist/agent-browser-use-$os-$arch$ext"
            # Embed cloudflared for the target so -tunnel works in the released binary.
            scripts/fetch-cloudflared.sh "$os" "$arch"
            GOOS=$os GOARCH=$arch OUT="$out" scripts/build.sh
            # Fail here if the binary is missing, instead of publishing an empty release.
            test -s "$out"
          done
          ls -la dist

      - name: Publish GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/agent-browser-use-* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/agent-browser-use-* \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
