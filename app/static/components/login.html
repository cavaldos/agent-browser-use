<!-- ============ Join screen ============ -->
<div id="login" class="fixed inset-0 grid place-items-center p-4">
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="glow absolute -top-48 left-1/2 h-[560px] w-[560px] -translate-x-1/2 rounded-full bg-indigo-600/25 blur-3xl"></div>
    <div class="absolute -bottom-40 -right-24 h-[420px] w-[420px] rounded-full bg-fuchsia-600/15 blur-3xl"></div>
    <div class="absolute inset-0 bg-[linear-gradient(to_right,rgba(255,255,255,.03)_1px,transparent_1px),linear-gradient(to_bottom,rgba(255,255,255,.03)_1px,transparent_1px)] bg-[size:48px_48px] [mask-image:radial-gradient(ellipse_at_center,black_30%,transparent_75%)]"></div>
  </div>
  <form id="loginForm" class="rise relative w-full max-w-sm rounded-3xl border border-white/10 bg-zinc-900/70 p-8 shadow-2xl shadow-black/50 backdrop-blur-xl">
    <div class="mb-8 flex flex-col items-center text-center">
      <div class="mb-4 grid h-14 w-14 place-items-center rounded-2xl bg-gradient-to-br from-indigo-400 to-violet-600 shadow-xl shadow-indigo-600/30">
        <i data-icon="logo" class="h-7 w-7 text-white"></i>
      </div>
      <h1 class="text-2xl font-semibold tracking-tight">Agent Browser Use</h1>
      <p class="mt-1.5 text-sm text-zinc-400">Watch your AI agent use the web — live.</p>
    </div>
    <label for="nameInput" class="label block">Your name</label>
    <input id="nameInput" class="field h-11" placeholder="e.g. Alex" maxlength="30" autocomplete="nickname" autofocus required>
    <button class="btn-primary mt-4 h-11 w-full text-[15px]">Join room <i data-icon="arrowRight" class="h-4 w-4"></i></button>
    <p class="mt-5 text-center text-xs text-zinc-500">Everyone in the room sees every step the agent takes, and can take over the browser at any time.</p>
  </form>
</div>
