    <!-- Control bar -->
    <div class="shrink-0 border-t border-white/[.06] bg-[#0f0f12]">
      <div id="bar" class="flex h-14 items-center gap-3 px-3 sm:px-4">
        <div class="flex flex-1 items-center gap-1">
          <div class="relative">
            <button id="helpBtn" class="icon-btn help-btn" title="Shortcuts"><i data-icon="help" class="h-[18px] w-[18px]"></i></button>
            <div id="helpPop" class="pop absolute bottom-12 left-0 z-40 w-72 rounded-xl border border-white/10 bg-zinc-900/95 p-4 text-[13px] shadow-2xl backdrop-blur" hidden>
              <p class="label">Shortcuts (while the screen is focused)</p>
              <dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-1.5 text-zinc-300">
                <dt><kbd>Alt</kbd>+<kbd>T</kbd></dt><dd>New tab</dd>
                <dt><kbd>Alt</kbd>+<kbd>W</kbd></dt><dd>Close tab</dd>
                <dt><kbd>Alt</kbd>+<kbd>1–9</kbd></dt><dd>Switch tab</dd>
                <dt><kbd>Ctrl</kbd>+<kbd>L</kbd></dt><dd>Address bar</dd>
                <dt><kbd>Ctrl</kbd>+<kbd>R</kbd></dt><dd>Reload</dd>
                <dt><kbd>Alt</kbd>+<kbd>←</kbd> <kbd>→</kbd></dt><dd>Back / forward</dd>
                <dt>Middle-click</dt><dd>Close tab / open link in background</dd>
              </dl>
            </div>
          </div>
          <button id="pickBtn" class="icon-btn" title="Pick an element to share with an agent"><i data-icon="pick" class="h-[18px] w-[18px]"></i></button>
          <span id="viewInfo" class="hidden text-xs tabular-nums text-zinc-500 sm:inline"></span>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
          <!-- Who drives the shared browser: shows the state and the action in one button -->
          <button id="ctrlBtn" class="ctrl-btn free">
            <span class="ctrl-icon"></span>
            <span class="ctrl-status"></span>
            <span class="ctrl-action">Take control</span>
          </button>
          <!-- The agent takes control by itself when it acts; this stops it until clicked again -->
          <button id="blockBtn" class="block-btn">
            <span class="block-icon"></span>
            <span class="block-label">Block agent</span>
          </button>
          <div class="bar-sep h-6 w-px bg-white/[.08]"></div>
          <button id="playBtn" class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-white/[.08] text-zinc-100 ring-1 ring-white/10 transition hover:bg-white/15 active:scale-95" title="Pause stream"></button>
          <div class="flex items-center gap-1">
            <button id="soundBtn" class="icon-btn" title="Mute"></button>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" class="range w-20 sm:w-28" title="Volume">
          </div>
          <div class="bar-sep h-6 w-px bg-white/[.08]"></div>
          <button id="pipBtn" class="icon-btn" title="Picture-in-picture" hidden><i data-icon="pip" class="h-[18px] w-[18px]"></i></button>
          <button id="fullBtn" class="icon-btn" title="Fullscreen"><i data-icon="expand" class="h-[18px] w-[18px]"></i></button>
        </div>

        <div class="flex flex-1 items-center justify-end">
          <div id="emoteList" class="emote-inline flex items-center gap-0.5"></div>
          <div class="relative">
            <button id="emoteToggle" class="emote-toggle emote-btn" title="Reactions">😀</button>
            <div id="emotePop" class="pop absolute bottom-12 right-0 z-40 grid grid-cols-4 gap-1 rounded-xl border border-white/10 bg-zinc-900/95 p-2 shadow-2xl backdrop-blur" hidden></div>
          </div>
        </div>
      </div>
    </div>
