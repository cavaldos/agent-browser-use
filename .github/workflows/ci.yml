name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Check formatting
        run: cargo fmt --manifest-path app/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path app/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path app/Cargo.toml

      - name: Build
        run: scripts/build.sh

      - name: Smoke test the binary
        run: |
          ./bin/agent-browser-use -version
          ./bin/agent-browser-use -h
