    <!-- Header -->
    <header class="flex h-12 shrink-0 items-center gap-3 border-b border-white/[.06] px-3 sm:px-4">
      <div class="flex items-center gap-2.5">
        <div class="grid h-7 w-7 place-items-center rounded-lg bg-gradient-to-br from-indigo-400 to-violet-600 shadow-md shadow-indigo-600/30">
          <i data-icon="logo" class="h-4 w-4 text-white"></i>
        </div>
        <span class="font-semibold tracking-tight">AGENT BROWSER</span>
        <span class="hud-jp" aria-hidden="true">エージェントブラウザ</span>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <div id="status" class="flex items-center gap-2 rounded-full bg-white/[.04] px-2.5 py-1 text-xs text-zinc-400 ring-1 ring-inset ring-white/[.06]">
          <span class="relative flex h-2 w-2"><span class="ping absolute inline-flex h-full w-full rounded-full opacity-60"></span><span class="dot relative inline-flex h-2 w-2 rounded-full bg-amber-400"></span></span>
          <span class="txt">Connecting…</span>
        </div>

        <!-- Browser IP: always shows the agent browser's public IP; the switch sends it through the proxy (WARP) -->
        <div id="ipChip" class="flex h-8 items-center gap-2 rounded-full pl-2.5 pr-1.5 text-xs text-zinc-400 ring-1 ring-inset ring-white/[.06]" title="Public IP of the agent browser">
          <i data-icon="globe" class="h-3.5 w-3.5"></i>
          <span id="ipText" class="tabular-nums">IP…</span>
          <button id="ipSwitch" role="switch" aria-checked="false" class="relative h-5 w-9 rounded-full bg-zinc-700 transition" title="Route the agent browser through WARP" hidden>
            <span class="absolute left-0.5 top-0.5 h-4 w-4 rounded-full bg-white transition-transform" id="ipKnob"></span>
          </button>
        </div>

        <!-- Public link: switch the tunnel on/off, copy the link -->
        <div class="relative">
          <button id="tunnelBtn" class="flex h-8 items-center gap-1.5 rounded-full px-2.5 text-xs font-medium text-zinc-400 ring-1 ring-inset ring-white/[.06] transition hover:bg-white/[.06]" title="Share on a public link">
            <i data-icon="globe" class="h-3.5 w-3.5"></i><span id="tunnelLabel">Share</span>
          </button>
          <div id="tunnelPop" class="pop absolute right-0 top-11 z-40 w-80 rounded-xl border border-white/10 bg-zinc-900/95 p-3 shadow-2xl backdrop-blur" hidden>
            <div class="flex items-center justify-between">
              <p class="label">Public link</p>
              <button id="tunnelSwitch" role="switch" aria-checked="false" class="relative h-5 w-9 rounded-full bg-zinc-700 transition aria-checked:bg-emerald-500" title="Turn the public link on or off">
                <span class="absolute left-0.5 top-0.5 h-4 w-4 rounded-full bg-white transition-transform" id="tunnelKnob"></span>
              </button>
            </div>
            <p id="tunnelHint" class="mt-1 text-xs text-zinc-400">Off. Turn on to get a link anyone can open, no router setup.</p>
            <div id="tunnelOn" hidden>
              <div class="mt-2 flex items-center gap-1.5">
                <input id="tunnelUrl" readonly class="min-w-0 flex-1 rounded-lg bg-white/[.06] px-2 py-1.5 text-xs text-zinc-200 outline-none ring-1 ring-inset ring-white/10">
                <button id="tunnelCopy" class="rounded-lg bg-indigo-500 px-2.5 py-1.5 text-xs font-medium text-white hover:bg-indigo-400">Copy</button>
              </div>
              <div id="tunnelPwRow" class="mt-2 flex items-center gap-1.5" hidden>
                <span class="text-xs text-zinc-400">Password</span>
                <input id="tunnelPw" readonly class="min-w-0 flex-1 rounded-lg bg-white/[.06] px-2 py-1.5 text-xs text-zinc-200 outline-none ring-1 ring-inset ring-white/10">
                <button id="tunnelPwCopy" class="rounded-lg bg-white/10 px-2.5 py-1.5 text-xs text-zinc-200 hover:bg-white/20">Copy</button>
              </div>
              <p class="mt-2 text-[11px] text-zinc-500">Turning it off makes the link stop working.</p>
            </div>
          </div>
        </div>

        <!-- People in the room: avatar stack, click for the full list -->
        <div class="relative">
          <button id="membersBtn" class="flex h-9 items-center gap-2 rounded-full py-1 pl-1 pr-2.5 transition hover:bg-white/[.06]" title="People in the room">
            <span id="members" class="flex items-center -space-x-1"></span>
            <span class="flex items-center gap-1 text-xs font-medium tabular-nums text-zinc-400"><i data-icon="user" class="h-3.5 w-3.5"></i><span id="memberCount">0</span></span>
          </button>
          <div id="membersPop" class="pop absolute right-0 top-11 z-40 w-64 rounded-xl border border-white/10 bg-zinc-900/95 p-2 shadow-2xl backdrop-blur" hidden>
            <p class="label px-2 pt-1">In the room</p>
            <ul id="memberList" class="max-h-72 space-y-0.5 overflow-y-auto"></ul>
          </div>
        </div>

        <div class="h-5 w-px bg-white/[.08]"></div>
        <button id="themeBtn" class="icon-btn" title="Toggle light / dark mode"><i data-icon="moon" class="i-moon h-[18px] w-[18px]"></i><i data-icon="sun" class="i-sun h-[18px] w-[18px]"></i></button>
        <button id="sidebarToggle" class="icon-btn relative" title="Chat & settings">
          <i data-icon="panel" class="h-[18px] w-[18px]"></i>
          <span id="unread" class="absolute -right-0.5 -top-0.5 grid h-4 min-w-4 place-items-center rounded-full bg-indigo-500 px-1 text-[10px] font-semibold leading-none text-white ring-2 ring-[#0b0b0e]" hidden></span>
        </button>
      </div>
    </header>
